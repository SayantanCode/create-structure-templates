name: Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  index-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate-composer-index.mjs
      - name: Fail if composer-index.json is out of date
        run: git diff --exit-code composer/composer-index.json
      - run: node scripts/generate-index.mjs
      - name: Fail if index.json is out of date
        run: git diff --exit-code index.json

  compose-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: express-cjs
            modules: "db-mongoose,validation-zod,auth-jwt,rbac-simple,testing-jest,docker,ci"
          - base: express-esm
            modules: "db-mongoose,validation-zod,auth-jwt,rbac-permission,testing-jest,docker,ci"
          - base: express-ts
            modules: "db-mongoose,validation-zod,auth-jwt,rbac-simple,testing-jest,docker,ci"
          - base: fastify-esm
            modules: "db-mongoose,validation-zod,auth-jwt-fastify,rbac-simple-fastify,testing-jest-fastify,docker,ci"
          - base: nestjs
            modules: "db-mongoose,validation-zod,auth-jwt-nest,rbac-simple-nest,testing-jest-nest,docker,ci"
          - base: react-vite-tsx
            modules: "router-react,styling-tailwind,state-zustand,auth-react,testing-vitest"
          - base: react-vite-tsx
            modules: "router-react,styling-mui,state-zustand,auth-react,testing-vitest"
          - base: react-vite-tsx
            modules: "router-react,styling-antd,state-zustand,auth-react,testing-vitest"
          - base: react-vite-jsx
            modules: "router-react,styling-tailwind,state-zustand,auth-react,testing-vitest"
    steps:
      - name: Checkout templates (this ref)
        uses: actions/checkout@v4
        with:
          path: templates
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          repository: SayantanCode/cli-project-structure-builder
          path: cli
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install CLI deps
        working-directory: cli
        run: npm ci
      - name: Compose, install, and build ${{ matrix.base }} + [${{ matrix.modules }}]
        working-directory: templates
        env:
          COMPOSER_LOCAL_DIR: ${{ github.workspace }}/templates/composer
          CLI_REPO_PATH: ${{ github.workspace }}/cli
        run: node scripts/verify-compose.mjs "${{ matrix.base }}" "${{ matrix.modules }}" "${{ runner.temp }}/out"
